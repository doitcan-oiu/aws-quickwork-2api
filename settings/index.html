<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amazon Quick 设置</title>
  <script src="_magpie/bridge.js"></script>
  <script src="settings.js" defer></script>
  <style>
    body { margin: 0; }
    fieldset { border: 0; margin: 0; padding: 4px; max-width: 34rem; min-width: 0; }
    label { display: grid; grid-template-columns: minmax(0, 1fr) minmax(9rem, 1.6fr); align-items: center; gap: 1rem; margin-bottom: .8rem; }
    input, select { box-sizing: border-box; width: 100%; }
    input[type="checkbox"] { width: auto; justify-self: start; }
    details { margin: .25rem 0 .8rem; }
    summary { cursor: pointer; }
    details[open] summary { margin-bottom: .8rem; }
    .actions { display: flex; align-items: center; gap: .75rem; }
    @media (max-width: 19rem) { label { grid-template-columns: 1fr; gap: .25rem; } }
  </style>
</head>
<body>
  <fieldset id="fields" aria-label="Amazon Quick 设置" disabled>
    <label for="appVersion">Quick App 版本号<input id="appVersion" name="appVersion" type="text" maxlength="64" spellcheck="false" required></label>
    <label for="hours">每账号月度额度（小时）<input id="hours" name="monthlyHours" type="number" min="0" step="any" required></label>
    <label for="transport">连接方式
      <select id="transport" name="transport">
        <option value="aidp">AIDP（默认）</option>
        <option value="gateway">Quick Gateway</option>
      </select>
    </label>
    <details>
      <summary>高级设置</summary>
      <label for="loginWizardPort">登录向导端口<input id="loginWizardPort" name="loginWizardPort" type="number" min="1024" max="65535" step="1" required></label>
      <label for="region">AWS 登录区域<input id="region" name="region" type="text" placeholder="沿用服务器设置" spellcheck="false"></label>
      <label for="timezone">对话时区<input id="timezone" name="timezone" type="text" placeholder="Asia/Taipei" spellcheck="false" required></label>
      <label for="locale">对话语言<input id="locale" name="locale" type="text" placeholder="zh-TW" spellcheck="false" required></label>
      <label for="thinkingEffort">思考强度
        <select id="thinkingEffort" name="thinkingEffort">
          <option value="off">跟随上游（默认）</option>
          <option value="low">低</option><option value="medium">中</option><option value="high">高</option>
        </select>
      </label>
      <label for="requestTimeoutSeconds">请求超时（秒）<input id="requestTimeoutSeconds" name="requestTimeoutSeconds" type="number" min="1" max="2147483" step="1" required></label>
      <label for="surface">客户端标识（Surface）<input id="surface" name="surface" type="text" spellcheck="false" required></label>
      <label for="outpostId">Outpost ID<input id="outpostId" name="outpostId" type="text" placeholder="可留空" spellcheck="false"></label>
      <label for="workingSessionId">Working Session ID<input id="workingSessionId" name="workingSessionId" type="text" placeholder="可留空" spellcheck="false"></label>
      <label for="keepSessions">保留上游会话<input id="keepSessions" name="keepSessions" type="checkbox"></label>
    </details>
    <div class="actions">
      <button type="button" id="save">保存</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </fieldset>
</body>
</html>
